version: "3.8"
services:
  roscore:
    image: ros:noetic-ros-core
    command: /bin/bash -c "roscore"
    network_mode:
      "host"

  mercury_app:
    build: .
    command: /bin/bash
    privileged: true
    tty: true
    volumes:
      - ./:/home/proj
    network_mode:
      "host"
    environment:
      - ROS_MASTER_URI=http://172.28.1.2:11311
      - ROS_IP=172.28.1.3

